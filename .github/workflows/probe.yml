name: probe
on:
  push:
    branches: [arena/e3952d18-game]
    paths: ['.probe/**']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run probe
        run: python3 .probe/probe.py
