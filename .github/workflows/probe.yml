name: probe
on:
  push:
    branches: [arena/e3952d18-game]
    paths: ['.probe/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: run probe
        run: python3 .probe/probe.py
      - name: publish result back to the branch
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@local"
          git add probe_out/
          git commit -m "probe result $(date -u +%H:%M:%S)" || echo "no change"
          git push
