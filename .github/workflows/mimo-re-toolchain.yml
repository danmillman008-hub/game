name: mimo-re-toolchain (Ghidra full install + Auto Analysis via GitHub proxy)

# TEMPORARY ANALYSIS TOOLCHAIN ONLY.
# Never touches mimo-ui/UPGRADE, the ZIP, MANIFEST, the verifier or the v12 Drive plan.
# Correction applied: ALL 12 DEX are inventoried and imported (not just 3),
# Auto Analysis is ENABLED (previous run used -noanalysis), and REA runs on a
# separate full JDK 21 while Ghidra uses JDK 25.

on:
  push:
    paths:
      - 'ANALYSIS/_TOOLCHAIN_TRIGGER'
      - '.github/workflows/mimo-re-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimo-re-toolchain
  cancel-in-progress: false

jobs:
  ghidra-full-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare evidence directory
        run: |
          mkdir -p ANALYSIS/GHIDRA
          : > ANALYSIS/GHIDRA/run.log
          : > ANALYSIS/GHIDRA/CONTROL_FLOW.txt

      - name: Install JDK 25 for Ghidra (kept separate from REA's JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Record JDK 25 path
        run: echo "JDK25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Fetch the OFFICIAL Ghidra 12.2 release (runner has full network)
        id: gh
        shell: bash
        run: |
          {
          set -uo pipefail
          mkdir -p ANALYSIS/GHIDRA
          URL='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip'
          echo "== curl =="
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ghidra.zip" "$URL"
          echo "curl_exit=$? downloaded_bytes=$(stat -c %s "$RUNNER_TEMP/ghidra.zip" 2>/dev/null || echo 0)"
          sha256sum "$RUNNER_TEMP/ghidra.zip" > ANALYSIS/GHIDRA/GHIDRA_ZIP.sha256
          unzip -q -o "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra_dist"
          D=$(find "$RUNNER_TEMP/ghidra_dist" -maxdepth 1 -mindepth 1 -type d -name 'ghidra_*' | sort | head -1)
          echo "install_dir=$D"
          echo "analyzeHeadless=$(test -x "$D/support/analyzeHeadless" && echo EXECUTABLE || echo MISSING)"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log
          D=$(find "$RUNNER_TEMP/ghidra_dist" -maxdepth 1 -mindepth 1 -type d -name 'ghidra_*' | sort | head -1)
          test -n "$D" && test -x "$D/support/analyzeHeadless"

      - name: Fetch the REA-required JADX engine (also proxied through GitHub)
        continue-on-error: true
        shell: bash
        run: |
          {
          set -uo pipefail
          U='https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar'
          curl -fL --retry 3 -o "$RUNNER_TEMP/jadx-headless-mcp.jar" "$U"
          echo "curl_exit=$?"
          sha256sum "$RUNNER_TEMP/jadx-headless-mcp.jar" > ANALYSIS/GHIDRA/JADX_JAR.sha256
          cat ANALYSIS/GHIDRA/JADX_JAR.sha256
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Ghidra install inventory
        if: steps.gh.outcome == 'success'
        shell: bash
        run: |
          {
          set -uo pipefail
          D='${{ steps.gh.outputs.dir }}'
          {
            echo '# Ghidra — full install through the GitHub Actions proxy'
            echo
            echo "- workflow run: ${{ github.run_id }} / commit ${{ github.sha }} / $(date -u +%FT%TZ)"
            echo "- JDK for Ghidra: $JDK25_HOME ($(java -version 2>&1 | head -1))"
            echo "- release asset: ghidra_12.2_PUBLIC_20261016.zip"
            echo "- release sha256: $(cut -d' ' -f1 ANALYSIS/GHIDRA/GHIDRA_ZIP.sha256)"
            echo "- installed files: $(find "$D" -type f | wc -l) / size $(du -sh "$D" | cut -f1)"
            echo "- analyzeHeadless: $(test -x "$D/support/analyzeHeadless" && echo EXECUTABLE || echo MISSING)"
            echo "- application.version: $(grep application.version "$D/Ghidra/application.properties" | tr '\n' ' ')"
          } > ANALYSIS/GHIDRA/INSTALL.md
          cat ANALYSIS/GHIDRA/INSTALL.md
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: COVERAGE — import ALL 12 DEX with Ghidra (inventory script)
        id: coverage
        if: steps.gh.outcome == 'success'
        shell: bash
        run: |
          {
          set -uo pipefail
          D='${{ steps.gh.outputs.dir }}'
          rm -rf "$RUNNER_TEMP/ghidra_cov"
          mkdir -p "$RUNNER_TEMP/ghidra_cov"
          : > ANALYSIS/GHIDRA/DEX_COVERAGE.txt
          ARGS=()
          for f in ANALYSIS/_INPUT/classes*.dex; do ARGS+=("$f"); done
          echo "importing ${#ARGS[@]} DEX files: ${ARGS[*]}"
          "$D/support/analyzeHeadless" "$RUNNER_TEMP/ghidra_cov" Mimo935Coverage \
            -import "${ARGS[@]}" -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/ANALYSIS/_TOOLCHAIN/ghidra_scripts" \
            -postScript MimoDexCoverage.java -deleteProject 2>&1 | tee ANALYSIS/GHIDRA/coverage.log
          echo "coverage_headless_exit=${PIPESTATUS[0]}"
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: AUTO ANALYSIS — full Ghidra analysis of the primary DEX
        id: analysis
        if: steps.gh.outcome == 'success'
        shell: bash
        run: |
          {
          set -uo pipefail
          D='${{ steps.gh.outputs.dir }}'
          rm -rf "$RUNNER_TEMP/ghidra_an"
          mkdir -p "$RUNNER_TEMP/ghidra_an"
          : > ANALYSIS/GHIDRA/CONTROL_FLOW.txt
          echo "== analyzeHeadless WITH auto analysis, NO -noanalysis =="
          java -version 2>&1 | head -1
          "$D/support/analyzeHeadless" "$RUNNER_TEMP/ghidra_an" Mimo935Analysis \
            -import ANALYSIS/_INPUT/classes.dex \
            -analysisTimeoutPerFile 900 \
            -scriptPath "$GITHUB_WORKSPACE/ANALYSIS/_TOOLCHAIN/ghidra_scripts" \
            -postScript MimoControlFlow.java -deleteProject 2>&1 | tee ANALYSIS/GHIDRA/auto_analysis.log
          echo "auto_headless_exit=${PIPESTATUS[0]}"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Install a SEPARATE full JDK 21 for REA
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: REA doctor on full JDK 21 (JDK 25 of Ghidra untouched)
        id: rea
        continue-on-error: true
        shell: bash
        run: |
          {
          set -uo pipefail
          echo "JAVA_HOME(REA)=$JAVA_HOME"
          echo "JDK25_HOME(Ghidra)=$JDK25_HOME"
          echo "java --list-modules | grep jdk.compiler:"
          "$JAVA_HOME/bin/java" --list-modules | grep -E '^jdk\.compiler' || true
          mkdir -p "$RUNNER_TEMP/rea"
          cd "$RUNNER_TEMP/rea"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund rea-agents@6.7.0 >/dev/null 2>&1
          D='${{ steps.gh.outputs.dir }}'
          export REA_JADX_MCP_JAR="$RUNNER_TEMP/jadx-headless-mcp.jar"
          export GHIDRA_INSTALL_DIR="$D"
          ./node_modules/.bin/rea-agents doctor --provider jadx --json \
            > "$GITHUB_WORKSPACE/ANALYSIS/GHIDRA/REA_DOCTOR.json" 2>&1
          echo "rea_doctor_exit=$?"
          cat "$GITHUB_WORKSPACE/ANALYSIS/GHIDRA/REA_DOCTOR.json" | head -c 2000
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ANALYSIS/GHIDRA/run.log"

      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          {
          mkdir -p ANALYSIS/GHIDRA
          {
            echo '# Ghidra / REA chain — corrected run'
            echo
            echo "- run ${{ github.run_id }} / commit ${{ github.sha }} / $(date -u +%FT%TZ)"
            echo "- Ghidra fetch: ${{ steps.gh.outcome }}; coverage: ${{ steps.coverage.outcome }}; auto analysis: ${{ steps.analysis.outcome }}; REA doctor: ${{ steps.rea.outcome }}"
            echo "- corrections applied: ALL 12 DEX imported (not 3); Auto Analysis ENABLED (no -noanalysis); full JDK 21 for REA separate from JDK 25 for Ghidra"
            echo
            echo '## All-12 DEX coverage'
            echo '```'
            cat ANALYSIS/GHIDRA/DEX_COVERAGE.txt 2>/dev/null || echo '(none)'
            echo '```'
            echo
            echo '## Control flow / function report'
            echo '```'
            head -60 ANALYSIS/GHIDRA/CONTROL_FLOW.txt 2>/dev/null || echo '(none)'
            echo '```'
            echo
            echo '## run.log tail'
            echo '```'
            tail -50 ANALYSIS/GHIDRA/run.log 2>/dev/null || echo '(none)'
            echo '```'
          } > ANALYSIS/GHIDRA/README.md
          cat ANALYSIS/GHIDRA/README.md
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Commit evidence back to the analysis branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  'mimo-re-toolchain[bot]'
          git config user.email 'mimo-re-toolchain[bot]@users.noreply.github.com'
          git add -f ANALYSIS/GHIDRA
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'analysis: Ghidra Auto Analysis on all 12 DEX + control flow + REA doctor on separate full JDK'
          git pull --rebase origin arena/aebb90b7-game
          git push origin HEAD:arena/aebb90b7-game
