name: mimo-re-toolchain (Ghidra full install via GitHub proxy)

# TEMPORARY ANALYSIS TOOLCHAIN ONLY.
# This workflow never touches mimo-ui/UPGRADE, the ZIP, MANIFEST, the verifier,
# or the v12 Drive plan. It installs the real Ghidra release on a GitHub runner
# (the sandbox cannot reach release-assets.githubusercontent.com), runs Ghidra
# headless on the original Mimo 9.35 DEX files, and commits only text evidence
# back to ANALYSIS/GHIDRA on this branch.

on:
  push:
    paths:
      - 'ANALYSIS/_TOOLCHAIN_TRIGGER'
      - '.github/workflows/mimo-re-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimo-re-toolchain
  cancel-in-progress: false

jobs:
  ghidra-full-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare evidence directory
        run: |
          mkdir -p ANALYSIS/GHIDRA
          : > ANALYSIS/GHIDRA/run.log

      - name: Install JDK 25 (Ghidra 12.2 requires it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch the OFFICIAL Ghidra 12.2 release (runner has full network)
        id: gh
        shell: bash
        run: |
          {
          set -uo pipefail
          mkdir -p ANALYSIS/GHIDRA
          URL='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip'
          echo "== curl =="
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ghidra.zip" "$URL"
          echo "curl_exit=$?"
          echo "downloaded_bytes=$(stat -c %s "$RUNNER_TEMP/ghidra.zip" 2>/dev/null || echo 0)"
          sha256sum "$RUNNER_TEMP/ghidra.zip" > ANALYSIS/GHIDRA/GHIDRA_ZIP.sha256
          echo "sha_exit=$?"
          echo "== unzip =="
          unzip -q -o "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra_dist"
          echo "unzip_exit=$?"
          find "$RUNNER_TEMP/ghidra_dist" -maxdepth 1 -mindepth 1 -type d
          D=$(find "$RUNNER_TEMP/ghidra_dist" -maxdepth 1 -mindepth 1 -type d -name 'ghidra_*' | sort | head -1)
          echo "install_dir=$D"
          echo "analyzeHeadless=$(test -x "$D/support/analyzeHeadless" && echo EXECUTABLE || echo MISSING)"
          echo "ghidraRun=$(test -x "$D/ghidraRun" && echo EXECUTABLE || echo MISSING)"
          echo "application_properties=$(test -f "$D/Ghidra/application.properties" && echo PRESENT || echo MISSING)"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log
          D=$(find "$RUNNER_TEMP/ghidra_dist" -maxdepth 1 -mindepth 1 -type d -name 'ghidra_*' | sort | head -1)
          test -n "$D" && test -x "$D/support/analyzeHeadless"

      - name: Fetch the REA-required JADX engine (also proxied through GitHub)
        continue-on-error: true
        shell: bash
        run: |
          {
          set -uo pipefail
          U='https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar'
          curl -fL --retry 3 -o "$RUNNER_TEMP/jadx-headless-mcp.jar" "$U"
          echo "curl_exit=$?"
          sha256sum "$RUNNER_TEMP/jadx-headless-mcp.jar" > ANALYSIS/GHIDRA/JADX_JAR.sha256
          cat ANALYSIS/GHIDRA/JADX_JAR.sha256
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Ghidra install inventory
        if: steps.gh.outcome == 'success'
        shell: bash
        run: |
          {
          set -uo pipefail
          D='${{ steps.gh.outputs.dir }}'
          {
            echo '# Ghidra — full install through the GitHub Actions proxy'
            echo
            echo "- workflow run: ${{ github.run_id }}"
            echo "- commit: ${{ github.sha }}"
            echo "- date (UTC): $(date -u +%FT%TZ)"
            echo "- runner: $(uname -a)"
            echo "- JDK: $(java -version 2>&1 | head -2 | tr '\n' ' ')"
            echo "- release asset: ghidra_12.2_PUBLIC_20261016.zip"
            echo "- release sha256: $(cut -d' ' -f1 ANALYSIS/GHIDRA/GHIDRA_ZIP.sha256)"
            echo "- extracted directory: $(basename "$D")"
            echo "- installed files: $(find "$D" -type f | wc -l)"
            echo "- installed size: $(du -sh "$D" | cut -f1)"
            echo "- analyzeHeadless: $(test -x "$D/support/analyzeHeadless" && echo EXECUTABLE || echo MISSING)"
            echo "- ghidraRun: $(test -x "$D/ghidraRun" && echo EXECUTABLE || echo MISSING)"
            echo "- application.properties: $(cat "$D/Ghidra/application.properties" 2>/dev/null | tr '\n' ' ')"
          } > ANALYSIS/GHIDRA/INSTALL.md
          cat ANALYSIS/GHIDRA/INSTALL.md
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Run Ghidra headless on the ORIGINAL Mimo 9.35 DEX
        id: head
        if: steps.gh.outcome == 'success'
        shell: bash
        run: |
          {
          set -uo pipefail
          D='${{ steps.gh.outputs.dir }}'
          rm -rf "$RUNNER_TEMP/ghidra_project"
          mkdir -p "$RUNNER_TEMP/ghidra_project"
          : > ANALYSIS/GHIDRA/GHIDRA_PROGRAM_REPORT.txt
          "$D/support/analyzeHeadless" "$RUNNER_TEMP/ghidra_project" Mimo935 \
            -import ANALYSIS/_INPUT/classes.dex ANALYSIS/_INPUT/classes2.dex ANALYSIS/_INPUT/classes3.dex \
            -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/ANALYSIS/_TOOLCHAIN/ghidra_scripts" \
            -postScript MimoGhidraReport.java \
            -deleteProject 2>&1 | tee ANALYSIS/GHIDRA/analyzeHeadless.log
          echo "headless_exit=${PIPESTATUS[0]}"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Toolchain evidence summary
        if: always()
        shell: bash
        run: |
          {
          mkdir -p ANALYSIS/GHIDRA
          {
            echo '# Ghidra / REA proxy run — evidence'
            echo
            echo 'The sandbox has outbound access to github.com, api.github.com, codeload.github.com,'
            echo 'registry.npmjs.org, pypi.org and files.pythonhosted.org only.'
            echo 'release-assets.githubusercontent.com and objects.githubusercontent.com are blocked.'
            echo 'This workflow is the proxy: a GitHub-hosted runner downloads the official release,'
            echo 'fully installs it, executes it on the original DEX, and writes the text evidence'
            echo 'back into this branch with git (which the sandbox CAN reach).'
            echo
            echo "## Ghidra fetch step: ${{ steps.gh.outcome }}"
            echo "## Ghidra headless status: ${{ steps.head.outputs.status }}"
            echo
            echo '## Program report'
            echo '```'
            cat ANALYSIS/GHIDRA/GHIDRA_PROGRAM_REPORT.txt 2>/dev/null || echo '(none)'
            echo '```'
            echo
            echo '## run.log (tail)'
            echo '```'
            tail -80 ANALYSIS/GHIDRA/run.log 2>/dev/null || echo '(none)'
            echo '```'
          } > ANALYSIS/GHIDRA/README.md
          cat ANALYSIS/GHIDRA/README.md
          } 2>&1 | tee -a ANALYSIS/GHIDRA/run.log

      - name: Commit evidence back to the analysis branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  'mimo-re-toolchain[bot]'
          git config user.email 'mimo-re-toolchain[bot]@users.noreply.github.com'
          git add -f ANALYSIS/GHIDRA
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'analysis: Ghidra 12.2 full install + headless run via GitHub Actions proxy'
          git push origin HEAD:arena/aebb90b7-game
