name: Compare progression patch controls
on:
  push:
    branches: [arena/aebb90b7-game]
    paths: [APK_PATCH/_PROGRESSION_AB_RUN]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        variant: [current, original-keys, original-queue, both-original]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Recover original APK
        env:
          EXPECTED_APK_SHA256: '48ce1740aa4b1f892a267ae54199d514d929b97e947b612f4e53c3571e0f7c7a'
          EXPECTED_APK_BYTES: '142353499'
        run: |
          bash ANALYSIS/RUNTIME/MISSION_07/transfer_apk_m07.sh
          mv "$RUNNER_TEMP/MIMO_ORIGINAL.apk" "$RUNNER_TEMP/original.apk"
      - name: Build control APK
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          args=(--experimental-direct-main --diagnostic-skip-ghost-native-init --diagnostic-practice-stats-placeholder --experimental-include-practice-topics)
          case "$VARIANT" in current|original-keys) args+=(--experimental-preserve-queue);; esac
          case "$VARIANT" in original-keys|both-original) args+=(--diagnostic-preserve-keys-method);; esac
          python3 APK_PATCH/build_patched_apk.py --original "$RUNNER_TEMP/original.apk" --out "$RUNNER_TEMP/candidate.apk" --workdir "$RUNNER_TEMP/key" "${args[@]}"
          sha256sum "$RUNNER_TEMP/candidate.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 APK_PATCH/progression_ab_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: progression-evidence-${{ matrix.variant }}
          path: ${{ runner.temp }}/lesson-followup/
          if-no-files-found: warn
          retention-days: 7
