name: verify

# The whole repository, checked where the dependencies actually exist.
#
#   python3 studio/verify.py --ci
#
# `--ci` means an entry that is supposed to run here may not skip: a missing
# dependency fails the build instead of showing up as a quiet "skip". That is the
# difference between "the tests pass" and "the tests ran".

on:
  push:
    branches: [arena/e3952d18-game]
    paths-ignore: ['films/**', 'probe_out/**', '_inbox/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          # every dependency the inventory declares for a file that is supposed to
          # run here. Anything left out shows up as `skip`, which is exactly what
          # this job exists to prevent.
          pip install -q pillow numpy imageio-ffmpeg opencv-python-headless pyyaml \
                       androguard soundfile kokoro-onnx
      - name: verify (strict)
        id: verify
        # NOT `| tee`: a pipe returns tee's status, so a failing verify would still
        # show a green build. That is exactly the false confidence this job exists
        # to prevent.
        run: |
          set +e
          python3 studio/verify.py --ci > verify_out.txt 2>&1
          rc=$?
          cat verify_out.txt
          echo "verify exit code: $rc"
          exit $rc
      - name: publish the status file
        if: always()
        run: |
          git config user.name "verify-bot"; git config user.email "verify@local"
          git add -f REPO_STATUS.md 2>/dev/null || true
          git commit -m "verify: status from run ${{ github.run_id }}" || echo "no change"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 6
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: |
            verify_out.txt
            REPO_STATUS.md
