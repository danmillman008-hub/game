name: Test offline practice topic availability
on:
  push:
    branches: [arena/aebb90b7-game]
    paths: [APK_PATCH/_PRACTICE_TOPICS_RUN]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43284655444
          name: Mimo-practice-stats-diagnostic-untested
          path: ${{ runner.temp }}/fallback
      - name: Recover known original APK
        env:
          EXPECTED_APK_SHA256: '48ce1740aa4b1f892a267ae54199d514d929b97e947b612f4e53c3571e0f7c7a'
          EXPECTED_APK_BYTES: '142353499'
        run: |
          bash ANALYSIS/RUNTIME/MISSION_07/transfer_apk_m07.sh
          mv "$RUNNER_TEMP/MIMO_ORIGINAL.apk" "$RUNNER_TEMP/original.apk"
      - name: Build topic experiment
        run: |
          python3 -m unittest discover -s APK_PATCH/tests -q
          mkdir -p "$RUNNER_TEMP/topics"
          python3 APK_PATCH/build_patched_apk.py --original "$RUNNER_TEMP/original.apk" --out "$RUNNER_TEMP/topics/candidate.apk" --workdir "$RUNNER_TEMP/key" --experimental-direct-main --experimental-preserve-queue --diagnostic-skip-ghost-native-init --diagnostic-practice-stats-placeholder --experimental-include-practice-topics
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 APK_PATCH/practice_topics_probe.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mimo-practice-topic-experimental
          path: ${{ runner.temp }}/topics/candidate.apk
          compression-level: 0
          retention-days: 7
      - name: Save diagnostic evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/practice-topics" ]; then
            mkdir -p APK_PATCH/practice_topics_evidence
            cp "$RUNNER_TEMP/practice-topics/"* APK_PATCH/practice_topics_evidence/
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add APK_PATCH/practice_topics_evidence
            git diff --cached --quiet || { git commit -m 'Record offline practice topic test'; git push origin HEAD:arena/aebb90b7-game; }
          fi
