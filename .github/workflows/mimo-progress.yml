name: Mimo offline lesson progress diagnostic
on:
  push:
    branches: [arena/aebb90b7-game]
    paths: [APK_PATCH/_PROGRESS_RUN]
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified APK
        env:
          EXPECTED_APK_SHA256: '48ce1740aa4b1f892a267ae54199d514d929b97e947b612f4e53c3571e0f7c7a'
          EXPECTED_APK_BYTES: '142353499'
        run: |
          bash ANALYSIS/RUNTIME/MISSION_07/transfer_apk_m07.sh
          mv "$RUNNER_TEMP/MIMO_ORIGINAL.apk" "$RUNNER_TEMP/original.apk"
      - name: Build targeted diagnostic variants
        run: |
          python3 -m unittest discover -s APK_PATCH/tests -v
          python3 APK_PATCH/build_patched_apk.py --original "$RUNNER_TEMP/original.apk" --out "$RUNNER_TEMP/candidate.apk" --workdir "$RUNNER_TEMP/key" --experimental-direct-main --experimental-preserve-queue --diagnostic-skip-ghost-native-init
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test guest onboarding and direct startup offline
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 APK_PATCH/progress_probe.py
      - name: Retain tested APK as an experimental diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mimo-startup-fixed-experimental
          path: ${{ runner.temp }}/candidate.apk
          compression-level: 0
          retention-days: 7
      - name: Return bounded evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/progress-probe" ]; then
            mkdir -p APK_PATCH/progress_evidence
            cp "$RUNNER_TEMP/progress-probe/"* APK_PATCH/progress_evidence/
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add APK_PATCH/progress_evidence
            git diff --cached --quiet || { git commit -m 'Record offline lesson progress observations'; git push origin HEAD:arena/aebb90b7-game; }
          fi
