name: Retrieve guest profile evidence
on:
  push:
    branches: [arena/aebb90b7-game]
    paths: [APK_PATCH/_GUEST_PROFILE_EVIDENCE]
permissions:
  contents: write
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43299633177
          pattern: guest-profile-*
          path: ${{ runner.temp }}/evidence
      - name: Save evidence
        run: |
          mkdir -p APK_PATCH/guest_profile_evidence
          cp -r "$RUNNER_TEMP/evidence/"* APK_PATCH/guest_profile_evidence/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add APK_PATCH/guest_profile_evidence
          git diff --cached --quiet || { git commit -m 'Record original guest comparison'; git push origin HEAD:arena/aebb90b7-game; }
