name: Test diagnostic APK lesson progression
on:
  push:
    branches: [arena/aebb90b7-game]
    paths: [APK_PATCH/_STATS_LESSON_RUN]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43284655444
          name: Mimo-practice-stats-diagnostic-untested
          path: ${{ runner.temp }}
      - name: Verify uploaded artifact identity
        run: echo 'aca3b17efcdba50ae1c435d7c5cd6e7d9be9ae0ded71b13ee4eadcbd33520f2a  '"$RUNNER_TEMP/candidate.apk" | sha256sum -c
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 APK_PATCH/lesson_followup_probe.py
      - name: Save diagnostic evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/lesson-followup" ]; then
            mkdir -p APK_PATCH/stats_lesson_evidence
            cp "$RUNNER_TEMP/lesson-followup/"* APK_PATCH/stats_lesson_evidence/
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add APK_PATCH/stats_lesson_evidence
            git diff --cached --quiet || { git commit -m 'Record diagnostic APK lesson progression'; git push origin HEAD:arena/aebb90b7-game; }
          fi
