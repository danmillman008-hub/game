name: mimo-jadx-proxy (full Java decompile through GitHub)

# TEMPORARY ANALYSIS ONLY. Never touches mimo-ui/UPGRADE, ZIP, MANIFEST, verifier
# or the v12 Drive plan. The sandbox cannot download GitHub release assets;
# this runner downloads JADX 1.5.6, decompiles the ORIGINAL Mimo 9.35 DEX files
# (extracted from the Drive split archive) and commits the Java sources as a
# compressed text artifact back to this branch.

on:
  push:
    paths:
      - 'ANALYSIS/_JADX_TRIGGER'
      - '.github/workflows/mimo-jadx-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimo-jadx-proxy
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-Xmx5g'
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare output directory
        run: |
          mkdir -p ANALYSIS/DECOMPILED
          : > ANALYSIS/DECOMPILED/jadx.log

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JADX 1.5.6 official release (GitHub proxy)
        id: jadx
        shell: bash
        run: |
          set -euo pipefail
          U='https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip'
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/jadx.zip" "$U"
          sha256sum "$RUNNER_TEMP/jadx.zip" > ANALYSIS/DECOMPILED/JADX_ZIP.sha256
          unzip -q -o "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx_dist"
          "$RUNNER_TEMP/jadx_dist/bin/jadx" --version | tee ANALYSIS/DECOMPILED/JADX_VERSION.txt
          echo "jadx_bin=$RUNNER_TEMP/jadx_dist/bin/jadx" >> "$GITHUB_OUTPUT"

      - name: Full Java decompile of the original Mimo DEX files
        id: decompile
        shell: bash
        run: |
          {
          set -uo pipefail
          J='${{ steps.jadx.outputs.jadx_bin }}'
          for N in classes classes2 classes3; do
            echo "== $N.dex =="
            rm -rf "$RUNNER_TEMP/out_$N"
            "$J" -d "$RUNNER_TEMP/out_$N" -r -j 4 --show-bad-code \
              --log-level WARN "ANALYSIS/_INPUT/$N.dex" \
              2>&1 | tee -a ANALYSIS/DECOMPILED/jadx.log
            echo "$N exit=${PIPESTATUS[0]} java_files=$(find "$RUNNER_TEMP/out_$N" -name '*.java' 2>/dev/null | wc -l)"
          done
          } 2>&1 | tee -a ANALYSIS/DECOMPILED/jadx_run.log

      - name: Package decompiled sources + write report
        if: always()
        shell: bash
        run: |
          {
          set -uo pipefail
          mkdir -p ANALYSIS/DECOMPILED
          rm -rf "$RUNNER_TEMP/pkg" && mkdir -p "$RUNNER_TEMP/pkg"
          for N in classes classes2 classes3; do
            G=$(find "$RUNNER_TEMP/out_$N" -type d -path '*/com/getmimo' 2>/dev/null | sort | head -1)
            if [[ -n "$G" ]]; then
              mkdir -p "$RUNNER_TEMP/pkg/$N/com"
              cp -r "$G" "$RUNNER_TEMP/pkg/$N/com/"
              echo "$N: copied $G ($(find "$G" -name '*.java' | wc -l) java files)"
            else
              echo "$N: NO com/getmimo tree found"
            fi
          done
          tar czf ANALYSIS/DECOMPILED/getmimo_sources.tar.gz -C "$RUNNER_TEMP/pkg" .
          sha256sum ANALYSIS/DECOMPILED/getmimo_sources.tar.gz > ANALYSIS/DECOMPILED/SOURCES.sha256
          echo "tar_bytes=$(stat -c %s ANALYSIS/DECOMPILED/getmimo_sources.tar.gz)"
          echo "java_files=$(find "$RUNNER_TEMP/pkg" -name '*.java' | wc -l)"
          echo "java_lines=$(find "$RUNNER_TEMP/pkg" -name '*.java' -print0 | xargs -0 cat 2>/dev/null | wc -l)"
          echo "stub_files=$(grep -rl 'Method not decompiled' "$RUNNER_TEMP/pkg" --include='*.java' 2>/dev/null | wc -l)"
          {
            echo '# JADX 1.5.6 — full decompile of the original Mimo 9.35 DEX'
            echo
            echo "- workflow run: ${{ github.run_id }}"
            echo "- commit: ${{ github.sha }}"
            echo "- date (UTC): $(date -u +%FT%TZ)"
            echo "- jadx: $(cat ANALYSIS/DECOMPILED/JADX_VERSION.txt | tr '\n' ' ')"
            echo "- jadx zip sha256: $(cut -d' ' -f1 ANALYSIS/DECOMPILED/JADX_ZIP.sha256)"
            echo "- input: ANALYSIS/_INPUT/classes.dex + classes2.dex + classes3.dex"
            echo "  (extracted from the Drive split archive Mimo_9.35 (1).z01/.z02/.zip,"
            echo "   APK sha256 48ce1740aa4b1f892a267ae54199d514d929b97e947b612f4e53c3571e0f7c7a)"
            echo "- java files: $(find "$RUNNER_TEMP/pkg" -name '*.java' | wc -l)"
            echo "- java lines: $(find "$RUNNER_TEMP/pkg" -name '*.java' -print0 | xargs -0 cat 2>/dev/null | wc -l)"
            echo "- files containing JADX stubs: $(grep -rl 'Method not decompiled' "$RUNNER_TEMP/pkg" --include='*.java' 2>/dev/null | wc -l)"
            echo "- artifact: ANALYSIS/DECOMPILED/getmimo_sources.tar.gz"
            echo "- artifact sha256: $(cut -d' ' -f1 ANALYSIS/DECOMPILED/SOURCES.sha256)"
            echo
            echo '## Key classes present'
            for K in PathMapScreenKt PathMapViewModel GetPathMapState DefaultStreakRepository DefaultLeaderboardRepository DefaultRewardRepository ChapterFinishedViewModel LessonProgressRepository LessonProgressApi LeaderboardLeague SettingsRepository; do
              C=$(find "$RUNNER_TEMP/pkg" -name "$K*.java" 2>/dev/null | wc -l)
              echo "- $K: $C files"
            done
          } > ANALYSIS/DECOMPILED/REPORT.md
          cat ANALYSIS/DECOMPILED/REPORT.md
          } 2>&1 | tee -a ANALYSIS/DECOMPILED/jadx_run.log

      - name: Commit decompiled evidence back to the analysis branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  'mimo-jadx-proxy[bot]'
          git config user.email 'mimo-jadx-proxy[bot]@users.noreply.github.com'
          # keep logs bounded
          tail -n 4000 ANALYSIS/DECOMPILED/jadx.log > ANALYSIS/DECOMPILED/jadx.log.tmp || true
          mv ANALYSIS/DECOMPILED/jadx.log.tmp ANALYSIS/DECOMPILED/jadx.log
          git add -f ANALYSIS/DECOMPILED
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'analysis: JADX 1.5.6 full decompile of original Mimo DEX via GitHub proxy'
          git push origin HEAD:arena/aebb90b7-game
