name: mimo-jadx-proxy (full Java decompile through GitHub)

# TEMPORARY ANALYSIS ONLY. Never touches mimo-ui/UPGRADE, ZIP, MANIFEST, verifier
# or the v12 Drive plan. The sandbox cannot download GitHub release assets;
# this runner downloads JADX 1.5.6, decompiles the ORIGINAL Mimo 9.35 DEX files
# (extracted from the Drive split archive) and commits the Java sources as a
# compressed text artifact back to this branch.

on:
  push:
    paths:
      - 'ANALYSIS/_JADX_TRIGGER'
      - '.github/workflows/mimo-jadx-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimo-jadx-proxy
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare output directory (tee needs it to exist before the pipeline starts)
        run: |
          mkdir -p ANALYSIS/DECOMPILED
          : > ANALYSIS/DECOMPILED/run.log

      - name: Download, decompile, package (all diagnostics captured)
        shell: bash
        run: |
          {
          set +e
          echo "=== JADX PROXY RUN $(date -u +%FT%TZ) sha=${{ github.sha }} ==="
          mkdir -p ANALYSIS/DECOMPILED
          echo "java: $(java -version 2>&1 | head -2 | tr '\n' ' ')"

          U='https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip'
          echo "== downloading $U =="
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/jadx.zip" "$U"
          echo "curl_exit=$? bytes=$(stat -c %s "$RUNNER_TEMP/jadx.zip" 2>/dev/null)"
          sha256sum "$RUNNER_TEMP/jadx.zip" > ANALYSIS/DECOMPILED/JADX_ZIP.sha256
          unzip -q -o "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx_dist"
          echo "unzip_exit=$?"
          J="$RUNNER_TEMP/jadx_dist/bin/jadx"
          echo "jadx_bin=$J exists=$(test -x "$J" && echo yes || echo no)"
          "$J" --version > ANALYSIS/DECOMPILED/JADX_VERSION.txt 2>&1
          echo "version_exit=$? version=$(cat ANALYSIS/DECOMPILED/JADX_VERSION.txt | tr '\n' ' ')"
          "$J" --help > ANALYSIS/DECOMPILED/JADX_HELP.txt 2>&1
          echo "help_exit=$?"

          for N in classes; do
            echo "== DECOMPILE $N.dex =="
            rm -rf "$RUNNER_TEMP/out_$N"
            timeout 900 env JAVA_OPTS='-Xmx4g' "$J" -d "$RUNNER_TEMP/out_$N" -r -j 2 \
              --log-level ERROR "ANALYSIS/_INPUT/$N.dex" \
              > "$RUNNER_TEMP/$N.jadx.log" 2>&1
            RC=$?
            echo "$N jadx_exit=$RC java_files=$(find "$RUNNER_TEMP/out_$N" -name '*.java' 2>/dev/null | wc -l) log_lines=$(wc -l < "$RUNNER_TEMP/$N.jadx.log")"
            echo "---- $N jadx log head ----"
            head -25 "$RUNNER_TEMP/$N.jadx.log"
            echo "---- $N jadx log tail ----"
            tail -25 "$RUNNER_TEMP/$N.jadx.log"
            tail -n 2000 "$RUNNER_TEMP/$N.jadx.log" >> ANALYSIS/DECOMPILED/jadx.log
          done

          echo "== PACKAGE =="
          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/pkg"
          for N in classes; do
            G=$(find "$RUNNER_TEMP/out_$N" -type d -path '*/com/getmimo' 2>/dev/null | sort | head -1)
            echo "$N getmimo_tree=$G"
            if [[ -n "$G" ]]; then
              mkdir -p "$RUNNER_TEMP/pkg/$N/com"
              cp -r "$G" "$RUNNER_TEMP/pkg/$N/com/"
              echo "$N copied_files=$(find "$RUNNER_TEMP/pkg/$N" -name '*.java' | wc -l)"
            fi
          done
          tar czf ANALYSIS/DECOMPILED/getmimo_sources.tar.gz -C "$RUNNER_TEMP/pkg" .
          echo "tar_exit=$? tar_bytes=$(stat -c %s ANALYSIS/DECOMPILED/getmimo_sources.tar.gz 2>/dev/null)"
          sha256sum ANALYSIS/DECOMPILED/getmimo_sources.tar.gz > ANALYSIS/DECOMPILED/SOURCES.sha256

          NF=$(find "$RUNNER_TEMP/pkg" -name '*.java' 2>/dev/null | wc -l)
          NL=$(find "$RUNNER_TEMP/pkg" -name '*.java' -print0 2>/dev/null | xargs -0 cat 2>/dev/null | wc -l)
          NS=$(grep -rl 'Method not decompiled' "$RUNNER_TEMP/pkg" --include='*.java' 2>/dev/null | wc -l)
          {
            echo '# JADX 1.5.6 — full decompile of the original Mimo 9.35 DEX'
            echo
            echo "- workflow run: ${{ github.run_id }} / commit ${{ github.sha }} / $(date -u +%FT%TZ)"
            echo "- jadx: $(cat ANALYSIS/DECOMPILED/JADX_VERSION.txt | tr '\n' ' ')"
            echo "- jadx zip sha256: $(cut -d' ' -f1 ANALYSIS/DECOMPILED/JADX_ZIP.sha256)"
            echo "- input DEX: ANALYSIS/_INPUT/classes.dex (16,237,920 B; the DEX holding PathMapScreenKt)"
            echo "- java files: $NF"
            echo "- java lines: $NL"
            echo "- files containing JADX stubs: $NS"
            echo "- artifact: ANALYSIS/DECOMPILED/getmimo_sources.tar.gz"
            echo "- artifact sha256: $(cut -d' ' -f1 ANALYSIS/DECOMPILED/SOURCES.sha256)"
            echo
            echo '## Key classes present'
            for K in PathMapScreenKt PathMapViewModel GetPathMapState DefaultStreakRepository DefaultLeaderboardRepository DefaultRewardRepository ChapterFinishedViewModel LessonProgressRepository LessonProgressApi LeaderboardLeague SettingsRepository; do
              echo "- $K: $(find "$RUNNER_TEMP/pkg" -name "$K*.java" 2>/dev/null | wc -l) files"
            done
          } > ANALYSIS/DECOMPILED/REPORT.md
          cat ANALYSIS/DECOMPILED/REPORT.md
          echo "=== END OF RUN ==="
          exit 0
          } 2>&1 | tee ANALYSIS/DECOMPILED/run.log

      - name: Commit decompiled evidence back to the analysis branch
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name  'mimo-jadx-proxy[bot]'
          git config user.email 'mimo-jadx-proxy[bot]@users.noreply.github.com'
          git add -f ANALYSIS/DECOMPILED
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -m 'analysis: JADX 1.5.6 full decompile of original Mimo DEX via GitHub proxy'
          echo "commit_exit=$?"
          for i in 1 2 3; do
            git pull --rebase origin arena/aebb90b7-game
            git push origin HEAD:arena/aebb90b7-game && break
            echo "push attempt $i failed"
          done
          echo "final_push_exit=$?"
          exit 0
