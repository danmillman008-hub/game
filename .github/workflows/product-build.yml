name: product-build

# بیلد و تست پایهٔ اسکلت محصول (android/).
# هدف: هیچ commitی روی شاخهٔ محصول بدون کامپایل سبز و تست واحد سبز نماند.

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "android/**"
      - ".github/workflows/product-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/product-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: product-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 36
        # رانرهای ubuntu-24.04 خودشان Android SDK دارند؛ اکشن جانبی لازم نیست.
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK پیدا نشد (ANDROID_HOME خالی است)"
            exit 1
          fi
          echo "sdk at $SDK"
          ls "$SDK" | head
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager پیدا نشد"
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk ready"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble debug APK
        id: assemble
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --continue 2>&1 | tee -a /tmp/build.log

      - name: Unit tests (all modules)
        id: unit
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-daemon --continue 2>&1 | tee -a /tmp/build.log

      - name: Collect reports
        if: always()
        working-directory: android
        run: |
          {
            echo "### نتیجهٔ بیلد محصول"
            echo ""
            echo "- assemble: \`${{ steps.assemble.outcome }}\`"
            echo "- unit tests: \`${{ steps.unit.outcome }}\`"
            echo ""
            echo "| ماژول | تست | موفق | شکست | وضعیت |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/test_summary.py "$GITHUB_STEP_SUMMARY" || true

      - name: Publish test summary (rolling issue)
        # لاگ ران قابل خواندن نیست؛ خلاصهٔ تست‌ها در یک Issue ثابت منتشر می‌شود.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "- assemble: \`$ASSEMBLE\`"
            echo "- unit tests: \`$UNIT\`"
            echo
            echo "| ماژول | تست | موفق | شکست | وضعیت |"
            echo "|---|---|---|---|---|"
          } > /tmp/summary.md
          (cd android && python3 ../.github/scripts/test_summary.py) >> /tmp/summary.md || true
          {
            echo
            echo "فایل‌های نتیجهٔ یافت‌شده:"
            find . -path "*test-results*" -name "*.xml" | head -50 || true
          } >> /tmp/summary.md
          NUM=$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "product-build status") | .number' | head -1)
          if [ -z "$NUM" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "product-build status" --body-file /tmp/summary.md
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/summary.md
          fi

      - name: Report build errors to issue
        # لاگ ران در دسترس نیست؛ خلاصهٔ خطاها مستقیم در Issue منتشر می‌شود.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '### خطاهای کامپایل/بیلد'
            echo '```'
            grep -nE "^(e:|w: .*error)|error:|FAILURE:|What went wrong|Caused by:|> Task .* FAILED|Unresolved reference|Execution failed" /tmp/build.log \
              | head -200 || echo "الگوی خطا پیدا نشد"
            echo '```'
            echo
            echo '### ۶۰ خط آخر'
            echo '```'
            tail -60 /tmp/build.log || true
            echo '```'
          } > /tmp/report.md
          head -c 60000 /tmp/report.md > /tmp/report-cut.md || cp /tmp/report.md /tmp/report-cut.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "product-build failure (run $RUN_ID)" \
            --body-file /tmp/report-cut.md || echo "issue create failed"

      - name: Upload debug APK
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/**/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
