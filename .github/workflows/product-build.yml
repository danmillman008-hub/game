name: product-build

# بیلد و تست پایهٔ اسکلت محصول (android/).
# هدف: هیچ commitی روی شاخهٔ محصول بدون کامپایل سبز و تست واحد سبز نماند.

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "android/**"
      - ".github/workflows/product-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/product-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk ready"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble debug APK
        id: assemble
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Unit tests (all modules)
        id: unit
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Collect reports
        if: always()
        working-directory: android
        run: |
          echo "### نتیجهٔ بیلد محصول" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- assemble: \`${{ steps.assemble.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- unit tests: \`${{ steps.unit.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| ماژول | تست | وضعیت |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if ls */build/test-results/testDebugUnitTest/*.xml > /dev/null 2>&1; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows=[]
          for f in glob.glob('*/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(f).getroot()
              rows.append((r.get('name','?'), r.get('tests','0'), r.get('failures','0'), r.get('errors','0')))
          for n,t,fa,er in rows:
              st='✅' if fa=='0' and er=='0' else '❌'
              print(f"| {n} | {t} | {st} |")
          PY
          else
            echo "| — | — | بدون گزارش |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/**/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
