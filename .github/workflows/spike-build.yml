name: spike-build

# اعتبارسنجی «۴۸ ساعت»: بیلد واقعی Algidy (پایه و اصلاح‌شده) روی رانر گیت‌هاب.
# سندباکس به Maven/Android SDK دسترسی ندارد، پس بیلد اینجا انجام می‌شود.
# نتیجه به‌صورت Issue منتشر می‌شود تا از بیرون قابل خواندن باشد.

on:
  workflow_dispatch:
  push:
    paths:
      - "spike/**"
      - ".github/workflows/spike-build.yml"

permissions:
  contents: read
  issues: write

env:
  ALGIDY_REPO: https://github.com/NhuHuy-79/Algidy.git
  ALGIDY_REF: v2.0.0

jobs:
  # ---------------------------------------------------------------- baseline
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Clone Algidy
        run: git clone --depth 1 --branch "$ALGIDY_REF" "$ALGIDY_REPO" upstream

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Build (assembleDebug)
        working-directory: upstream
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/baseline-build.log"
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" > "$GITHUB_WORKSPACE/baseline-exit.txt"
          echo "build exit=$code"

      - name: Report baseline
        if: always()
        run: |
          {
            echo "### baseline"
            cat baseline-exit.txt 2>/dev/null || true
            find upstream/app/build/outputs -name "*.apk" -exec ls -l {} \; 2>/dev/null || echo "APK: none"
            echo
            echo '```'
            tail -c 12000 baseline-build.log 2>/dev/null || echo "no log"
            echo '```'
          } > baseline-report.md
          cat baseline-exit.txt baseline-report.md | head -40 || true

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          if-no-files-found: warn
          path: |
            baseline-build.log
            baseline-report.md
            upstream/app/build/outputs/apk/**/*.apk

  # ----------------------------------------------------------------- patched
  patched:
    name: patched
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Clone Algidy
        run: git clone --depth 1 --branch "$ALGIDY_REF" "$ALGIDY_REPO" upstream

      - name: Apply spike patch set
        run: |
          mkdir -p upstream/core/designsystem/src/main/res/font
          cp spike/assets/vazirmatn.ttf upstream/core/designsystem/src/main/res/font/vazirmatn.ttf
          cd upstream
          git apply --verbose ../spike/patches/*.patch
          echo "--- checks ---"
          grep -n "com.google.mlkit:barcode-scanning" gradle/libs.versions.toml
          grep -n "PERSIAN" core/model/src/main/java/com/nhuhuy/algidy/core/model/setting/AppLanguage.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Build (assembleDebug)
        working-directory: upstream
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/patched-build.log"
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" > "$GITHUB_WORKSPACE/patched-exit.txt"
          echo "build exit=$code"

      - name: Unit tests
        working-directory: upstream
        run: |
          set +e
          ./gradlew testDebugUnitTest --continue 2>&1 | tee "$GITHUB_WORKSPACE/patched-tests.log"
          code=${PIPESTATUS[0]}
          echo "TESTS_EXIT=$code" > "$GITHUB_WORKSPACE/patched-tests-exit.txt"
          echo "tests exit=$code"

      - name: Report patched
        if: always()
        run: |
          {
            echo "### patched"
            cat patched-exit.txt patched-tests-exit.txt 2>/dev/null || true
            find upstream/app/build/outputs -name "*.apk" -exec ls -l {} \; 2>/dev/null || echo "APK: none"
            apk=$(find upstream/app/build/outputs -name "*.apk" | head -1)
            if [ -n "$apk" ]; then
              echo
              echo "APK_BYTES=$(stat -c%s "$apk")"
              echo "APK_SHA256=$(sha256sum "$apk" | cut -d' ' -f1)"
              echo "--- fonts in APK ---"
              unzip -l "$apk" | grep -E "res/font|\.ttf" || true
              echo "--- 12 largest entries ---"
              unzip -l "$apk" | sort -k1 -n -r | head -12
            fi
            echo
            echo '```'
            tail -c 12000 patched-build.log 2>/dev/null || echo "no build log"
            echo '--- tests ---'
            tail -c 4000 patched-tests.log 2>/dev/null || echo "no test log"
            echo '```'
          } > patched-report.md
          cat patched-exit.txt 2>/dev/null || true

      - name: Upload patched artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched
          if-no-files-found: warn
          path: |
            patched-build.log
            patched-tests.log
            patched-report.md
            upstream/app/build/outputs/apk/**/*.apk

  # ------------------------------------------------------------------ report
  report:
    name: publish-report
    needs: [baseline, patched]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Publish report as issue
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, glob

          def tail(path, n=6000):
              try:
                  data = open(path, 'rb').read()
                  return data[-n:].decode('utf-8', 'replace')
              except Exception as e:
                  return f"(missing: {path}: {e})"

          parts = []
          for name in ("baseline", "patched"):
              parts.append(f"## {name}")
              base = f"artifacts/{name}"
              for f in sorted(glob.glob(base + "/*.md")):
                  parts.append(tail(f, 20000))
              for f in ("baseline-build.log", "patched-build.log", "patched-tests.log"):
                  p = os.path.join(base, f)
                  if os.path.exists(p):
                      parts.append(f"### tail {f}\n```\n{tail(p, 8000)}\n```")
          body = f"Run: {os.environ['RUN_URL']}\n\n" + "\n\n".join(parts)
          body = body[:60000]

          payload = json.dumps({
              "title": f"spike-build report (run {os.environ['RUN_ID']})",
              "body": body,
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print("issue created:", json.loads(r.read())["html_url"])
          PY
