name: spike-build

# اعتبارسنجی «۴۸ ساعت»: بیلد واقعی Algidy (پایه و اصلاح‌شده) روی رانر گیت‌هاب.
# اینجا سندباکس به Maven/Android SDK دسترسی ندارد، پس بیلد اینجا انجام می‌شود.

on:
  workflow_dispatch:
  push:
    paths:
      - "spike/**"
      - ".github/workflows/spike-build.yml"

env:
  ALGIDY_REPO: https://github.com/NhuHuy-79/Algidy.git
  ALGIDY_REF: v2.0.0

jobs:
  # ---------------------------------------------------------------- baseline
  baseline:
    name: baseline (Algidy بدون تغییر)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone Algidy @ ${{ env.ALGIDY_REF }}
        run: git clone --depth 1 --branch "$ALGIDY_REF" "$ALGIDY_REPO" upstream

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Build (assembleDebug)
        run: |
          chmod +x upstream/gradlew
          cd upstream
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../baseline-build.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" | tee ../baseline-exit.txt

      - name: Size report
        run: |
          {
            echo "## Baseline"
            echo '```'
            cat baseline-exit.txt 2>/dev/null || echo "no exit file"
            find upstream/app/build/outputs -name "*.apk" -exec ls -l {} \; 2>/dev/null || echo "APK: none"
            echo '```'
          } | tee baseline-report.md

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          if-no-files-found: warn
          path: |
            baseline-build.log
            baseline-report.md
            upstream/app/build/outputs/apk/**/*.apk

  # ----------------------------------------------------------------- patched
  patched:
    name: patched (ML Kit باندل‌شده + وزیرمتن + فارسی/RTL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone Algidy @ ${{ env.ALGIDY_REF }}
        run: git clone --depth 1 --branch "$ALGIDY_REF" "$ALGIDY_REPO" upstream

      - name: Apply spike patch set
        run: |
          mkdir -p upstream/core/designsystem/src/main/res/font
          cp spike/assets/vazirmatn.ttf upstream/core/designsystem/src/main/res/font/vazirmatn.ttf
          cd upstream
          git init -q . 2>/dev/null || true
          git apply --verbose ../spike/patches/*.patch
          echo "--- patch applied ---"
          grep -n "mlkit-barcode-scanning" gradle/libs.versions.toml
          grep -n "PERSIAN" core/model/src/main/java/com/nhuhuy/algidy/core/model/setting/AppLanguage.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Build (assembleDebug)
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../patched-build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" | tee ../patched-exit.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --continue 2>&1 | tee ../patched-tests.log
          echo "TESTS_EXIT=${PIPESTATUS[0]}" | tee ../patched-tests-exit.txt

      - name: Size + contents report
        run: |
          {
            echo "## Patched"
            echo '```'
            cat ../patched-exit.txt 2>/dev/null || true
            cat ../patched-tests-exit.txt 2>/dev/null || true
            find app/build/outputs -name "*.apk" -exec ls -l {} \; 2>/dev/null || echo "APK: none"
            echo '```'
            echo "### Fonts/resources inside APK"
            echo '```'
            apk=$(find app/build/outputs -name "*.apk" | head -1)
            if [ -n "$apk" ]; then
              unzip -l "$apk" | grep -E "res/font|\.ttf" || true
              echo "--- top 15 largest entries ---"
              unzip -l "$apk" | sort -k1 -n -r | head -15
            fi
            echo '```'
          } | tee ../patched-report.md

      - name: Upload patched artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched
          if-no-files-found: warn
          path: |
            patched-build.log
            patched-tests.log
            patched-report.md
            app/build/outputs/apk/**/*.apk
