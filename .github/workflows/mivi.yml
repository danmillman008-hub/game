name: mivi
# Generation runs HERE, not in the agent sandbox: the sandbox egress proxy blocks
# cpi.ufotosoft.com / algo-v1.wiseoel.com, a GitHub runner does not.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "job file"
        default: "films/short16/gen_jobs_bank.json"
      spec:
        description: "optional shot spec (composed through the motion bank first)"
        default: ""
  push:
    branches: [arena/e3952d18-game]
    paths: ['.mivi-trigger']
permissions:
  contents: write
concurrency:
  group: mivi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: network check
        run: |
          for h in https://cpi.ufotosoft.com https://algo-v1.wiseoel.com; do
            printf "%s -> " "$h"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "$h" || echo "unreachable"
          done
      - name: deps
        run: pip install -q imageio-ffmpeg
      - name: compose prompts from the motion bank (optional)
        if: ${{ github.event.inputs.spec != '' }}
        run: |
          python3 studio/motionbank.py jobs "${{ github.event.inputs.spec }}" \
                  --out films/short16/gen_jobs_auto.json
      - name: wiring test (no credits spent)
        run: python3 studio/tests/test_mivi_shot.py
      - name: generate
        run: |
          JOBS="films/short16/gen_jobs_bank.json"
          # `.mivi-trigger` may name a job file — that is how a batch is dispatched,
          # because the token here cannot create workflow_dispatch events (403).
          if [ -s .mivi-trigger ]; then
            t=$(head -1 .mivi-trigger | tr -d '[:space:]')
            if [ -n "$t" ] && [ -f "$t" ]; then JOBS="$t"; fi
          fi
          if [ -f films/short16/gen_jobs_auto.json ]; then JOBS="films/short16/gen_jobs_auto.json"; fi
          echo "jobs file: $JOBS"
          # PARALLEL: tasks are independent on the provider side, so keep several in
          # flight. Measured on an 8-shot batch: 24 min serial -> ~9 min at 4.
          PAR="${MIVI_PARALLEL:-4}"
          echo "parallel: $PAR"
          python3 studio/mivi_shot.py "$JOBS" --out films/short16/clips_gen --parallel "$PAR"
      - name: publish clips
        if: always()
        run: |
          git config user.name "mivi-bot"
          git config user.email "mivi@local"
          git add -f films/short16/clips_gen
          git commit -m "mivi: $(date -u +%H:%M) batch" || echo "no change"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed on try $i"; break; fi
            sleep 8
          done
          git log --oneline -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mivi-clips
          path: films/short16/clips_gen/
          retention-days: 14
