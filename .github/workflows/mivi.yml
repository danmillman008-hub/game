name: mivi
# Generation runs HERE, not in the agent sandbox: the sandbox egress proxy blocks
# cpi.ufotosoft.com / algo-v1.wiseoel.com, a GitHub runner does not.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "job file"
        default: "films/short16/gen_jobs_hug.json"
  push:
    branches: [arena/e3952d18-game]
    paths: ['.mivi-trigger']
permissions:
  contents: write
concurrency:
  group: mivi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: network check
        run: |
          for h in https://cpi.ufotosoft.com https://algo-v1.wiseoel.com; do
            printf "%s -> " "$h"; curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "$h" || echo "unreachable"
          done
      - name: deps
        run: pip install -q imageio-ffmpeg
      - name: generate
        run: python3 studio/mivi_shot.py films/short16/gen_jobs_hug.json --out films/short16/clips_gen
      - name: publish clips
        if: always()
        run: |
          git config user.name "mivi-bot"
          git config user.email "mivi@local"
          git add -f films/short16/clips_gen
          git commit -m "mivi: $(date -u +%H:%M) batch" || echo "no change"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed on try $i"; break; fi
            sleep 8
          done
          git log --oneline -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mivi-clips
          path: films/short16/clips_gen/
          retention-days: 14
