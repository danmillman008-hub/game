name: probe-links

on:
  push:
    paths:
      - '.github/workflows/probe-links.yml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: curl final links
        run: |
          for P in index.html t1-network.html t2-check.html t3-params.html t4-rate.html t5-batch.html ; do
            U="https://raw.githack.com/danmillman008-hub/game/45155a22ecce182c7ac348d0920ce223b2e8f2b7/docs/$P"
            echo "=== $P"
            curl -sS -m 25 -o /tmp/o -D /tmp/h -w 'code=%{http_code} size=%{size_download} ' "$U" || echo "curl failed $?"
            grep -i -E '^(content-type:)' /tmp/h | tr -d '\r' || true
            grep -c 'id="go"' /tmp/o | tr '\n' ' '; echo "buttons"
          done > /tmp/links.txt 2>&1
          python3 - <<'PY'
          body=open('/tmp/links.txt',encoding='utf-8',errors='replace').read()
          body=body.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A')
          CH=9000
          for i in range(0,min(len(body),9*CH),CH):
              print('::notice title=final-%d::%s'%(i//CH,body[i:i+CH]))
          print('::notice title=final-len::%d'%len(body))
          PY
