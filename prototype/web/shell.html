<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>Neon Alley — play</title>
<style>
  :root {
    --ink:#07050f; --cyan:#22e6ff; --pink:#ff2d95; --amber:#ffb020;
    --text:#e8eefc; --dim:#9aa6c4; --line:#2a2144;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:radial-gradient(1100px 700px at 50% -10%, #1b1035 0%, var(--ink) 65%);
    color:var(--text); overflow:hidden;
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px; }
  #stage { position:relative; display:flex; align-items:center; justify-content:center; }
  canvas#game {
    display:block; background:#05040b; border-radius:8px;
    box-shadow:0 0 0 1px #2a2144, 0 24px 60px rgba(0,0,0,.65), 0 0 90px rgba(34,230,255,.12);
    image-rendering:pixelated; image-rendering:crisp-edges;
    max-width:100vw; max-height:calc(100vh - 96px);
    touch-action:none;
  }
  .bar {
    display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap;
    color:var(--dim); font-size:12.5px; letter-spacing:.02em;
  }
  .bar b { color:#cfe0ff; font-weight:600; }
  kbd {
    display:inline-block; min-width:20px; padding:1px 5px; margin:0 1px; border-radius:4px;
    background:#191231; border:1px solid #3a2f5e; border-bottom-width:2px;
    font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; color:#fff; text-align:center;
  }
  a { color:var(--cyan); }
  #touch {
    display:none; width:100%; max-width:560px; gap:10px;
    grid-template-columns:repeat(4, 1fr); grid-auto-rows:56px; user-select:none;
  }
  #touch button {
    background:#151027; border:1px solid #332a55; border-radius:12px; color:#e8eefc;
    font:600 13px/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.06em;
    active:none; touch-action:none;
  }
  #touch button:active { background:#22e6ff; color:#03222a; }
  #touch button.wide { grid-column:span 2; }
  @media (pointer:coarse) {
    #touch { display:grid; }
    .bar.hint { display:none; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="384" height="240"></canvas></div>

<div class="bar hint">
  <span><b>A/D</b> move</span>
  <span><b>W/S</b> depth</span>
  <span><kbd>SPACE</kbd> jump</span>
  <span><b>J</b> punch</span>
  <span><b>K</b> kick</span>
  <span><kbd>R</kbd> restart</span>
  <span><kbd>ENTER</kbd> start</span>
</div>
<div class="bar"><span id="status">loading…</span></div>

<div id="touch">
  <button data-key="a">◀</button>
  <button data-key="d">▶</button>
  <button data-key="w">▲</button>
  <button data-key="s">▼</button>
  <button data-key="j">PUNCH</button>
  <button data-key="k">KICK</button>
  <button data-key="SPACE" class="wide">JUMP</button>
  <button data-key="r" class="wide">RESTART</button>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
(function () {
  "use strict";
  var NE = window.NeonAlley;
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var status = document.getElementById("status");

  var game = new NE.Game();
  var renderer = new NE.Renderer();
  renderer.canvas = canvas;        // draw straight into the visible canvas
  renderer.ctx = ctx;

  var held = { a: false, d: false, w: false, s: false };
  var pressed = { jump: false, punch: false, kick: false };
  var started = false;

  function fit() {
    // integer-friendly upscale: as large as fits, keeping the 16:10 canvas crisp
    var availW = Math.min(window.innerWidth - 24, 1920);
    var availH = window.innerHeight - (window.matchMedia("(pointer:coarse)").matches ? 220 : 104);
    var scale = Math.max(1, Math.floor(Math.min(availW / 384, availH / 240)));
    if (scale * 240 > availH) scale = Math.max(1, Math.min(availW / 384, availH / 240));
    canvas.style.width = Math.round(384 * scale) + "px";
    canvas.style.height = Math.round(240 * scale) + "px";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
  fit();

  var KEYMAP = {
    "a": "a", "arrowleft": "a",
    "d": "d", "arrowright": "d",
    "w": "w", "arrowup": "w",
    "s": "s", "arrowdown": "s"
  };

  function onKey(e, down) {
    var k = e.key.toLowerCase();
    if (KEYMAP[k]) { held[KEYMAP[k]] = down; e.preventDefault(); return; }
    if (down && !e.repeat) {
      if (k === " " || k === "spacebar") { pressed.jump = true; e.preventDefault(); }
      else if (k === "j" || k === "z") { pressed.punch = true; }
      else if (k === "k" || k === "x") { pressed.kick = true; }
      else if (k === "enter") { startOrRestart(); }
      else if (k === "r") { startOrRestart(true); }
      else if (k === "escape") { /* nothing to close: keep the page */ }
    }
    if (k === " " || k.startsWith("arrow")) e.preventDefault();
  }

  function startOrRestart(force) {
    if (game.state === NE.TITLE) {
      game.start();
      started = true;
    } else if (force) {
      game.reset();
      game.start();
      started = true;
    }
  }

  window.addEventListener("keydown", function (e) { onKey(e, true); });
  window.addEventListener("keyup", function (e) { onKey(e, false); });
  window.addEventListener("blur", function () {
    held.a = held.d = held.w = held.s = false;
  });

  // ---- touch buttons dispatch the same state as the keyboard
  Array.prototype.forEach.call(document.querySelectorAll("#touch button"), function (btn) {
    var key = btn.getAttribute("data-key");
    function press(on) {
      if (key === "a" || key === "d" || key === "w" || key === "s") { held[key] = on; return; }
      if (!on) return;
      if (key === "SPACE") pressed.jump = true;
      else if (key === "j") pressed.punch = true;
      else if (key === "k") pressed.kick = true;
      else if (key === "r") startOrRestart(true);
    }
    btn.addEventListener("touchstart", function (e) { e.preventDefault(); press(true); }, { passive: false });
    btn.addEventListener("touchend", function (e) { e.preventDefault(); press(false); }, { passive: false });
    btn.addEventListener("touchcancel", function () { press(false); });
    btn.addEventListener("mousedown", function (e) { e.preventDefault(); press(true); });
    btn.addEventListener("mouseup", function () { press(false); });
    btn.addEventListener("mouseleave", function () { press(false); });
  });

  // ---- fixed 60 Hz simulation, decoupled from the display refresh rate
  var STEP = 1 / 60;
  var acc = 0;
  var last = performance.now();
  var frames = 0;
  var fpsTimer = 0, fps = 0;

  function command() {
    var cmd = new NE.Command({
      move_x: (held.d ? 1 : 0) - (held.a ? 1 : 0),
      move_z: (held.s ? 1 : 0) - (held.w ? 1 : 0),
      jump: pressed.jump,
      punch: pressed.punch,
      kick: pressed.kick
    });
    pressed.jump = pressed.punch = pressed.kick = false;
    return cmd;
  }

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    acc += dt;
    var steps = 0;
    while (acc >= STEP && steps < 5) {
      if (game.state === NE.TITLE) {
        game.update(command());
      } else {
        game.update(command());
      }
      acc -= STEP;
      steps += 1;
      frames += 1;
    }

    renderer.draw(game, now / 1000);

    fpsTimer += dt;
    if (fpsTimer >= 0.5) {
      fps = Math.round(frames / fpsTimer);
      frames = 0; fpsTimer = 0;
      status.textContent = game.state === NE.TITLE
        ? "press ENTER or tap to start · deterministic 60 Hz · " + fps + " fps"
        : game.state === NE.PLAY
          ? "wave " + (game.wave_index + 1) + "/" + NE.CFG.WAVES.length +
            " · hp " + game.player.hp + "/" + game.player.max_hp + " · " + fps + " fps"
          : (game.state === NE.VICTORY ? "area cleared" : "you are down") +
            " · press R to run it again";
    }
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("pointerdown", function () {
    if (game.state === NE.TITLE) startOrRestart();
  });

  status.textContent = "press ENTER or tap the screen to start";
  requestAnimationFrame(loop);
  window.__neon = { game: game, renderer: renderer, NE: NE };   // for console poking
})();
</script>
</body>
</html>
